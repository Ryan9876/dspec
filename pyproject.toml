[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dspec-ai"
version = "0.1.0"
description = "Local spec-first DSpec AI prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
ai = ["dspy>=3,<4"]
tray = ["rumps>=0.4,<1"]
dev = ["pytest>=8,<10", "playwright>=1.49,<2"]

[project.scripts]
dspec-server = "dspec.app:main"
dspec-runner = "dspec.runner:cli"
dspec-optimize = "dspec.optimize:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["dspec"]
