[project]
name = "dspec-ai"
version = "0.1.0"
description = "Local spec-first software delivery prototype"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "dspy==3.3.1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
