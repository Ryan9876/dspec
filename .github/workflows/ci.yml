name: DSpec CI
# validation checkpoint: DS-CHG-001 reconstruction

on:
  push:
    branches:
      - main
      - "recovery/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q dspec
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Static export build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python runtime
        run: python -m pip install -e ".[dev]"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser workflow smoke
        env:
          DSPEC_BROWSER_SCREENSHOT: evidence/browser-smoke.png
        run: python tests/browser_smoke.py
      - name: Browser review integrity with deterministic DSPy model
        run: python tests/browser_review_integrity.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspec-browser-evidence
          path: |
            evidence/browser-smoke.png
            evidence/review-integrity.png
          if-no-files-found: ignore
          retention-days: 14

  browser-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python runtime
        run: python -m pip install -e ".[dev]"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Measure NFR-1.1 client interaction latency
        env:
          DSPEC_BROWSER_LATENCY_REPORT: evidence/browser-latency.json
          DSPEC_PROVIDER_MODAL_SCREENSHOT: evidence/provider-modal.png
        run: python tests/browser_latency.py
      - name: Upload browser latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspec-browser-latency-evidence
          path: |
            evidence/browser-latency.json
            evidence/provider-modal.png
          if-no-files-found: ignore
          retention-days: 14

  optimizer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optimizer extras
        run: python -m pip install -e ".[dev,optimize]"
      - name: Verify current DSPy MIPROv2 contract
        run: |
          python - <<'PY'
          import inspect
          import optuna
          import dspy
          from dspy.teleprompt import MIPROv2

          compile_params = inspect.signature(MIPROv2.compile).parameters
          assert "trainset" in compile_params
          assert "valset" in compile_params
          assert hasattr(dspy.ChainOfThought("question -> answer"), "save")
          assert hasattr(dspy.ChainOfThought("question -> answer"), "load")
          print("DSPy", getattr(dspy, "__version__", "UNKNOWN"))
          print("Optuna", optuna.__version__)
          PY
      - name: Validate optimizer CLI without model execution
        run: |
          cat > /tmp/dspec-reviewed.jsonl <<'EOF'
          {"schema_version":1,"source_id":"train-1","stage":"constitution","split":"train","reviewed":true,"inputs":{"raw_idea_description":"Build a local governed specification tool.","security_isolation_preferences":"Keep credentials local and require explicit runtime evidence."},"expected_spec":"# Project Constitution\n\n## Security\nAll credentials remain local and authorization boundaries are explicit.\n\n## Quality and Validation\nEvery material behavior requires acceptance criteria and objective tests.\n\n## Runtime\nThe application binds only to 127.0.0.1 on port 3210 and deployment verification is separate.","required_markers":["Security","acceptance","127.0.0.1"]}
          {"schema_version":1,"source_id":"validation-1","stage":"constitution","split":"validation","reviewed":true,"inputs":{"raw_idea_description":"Create a spec-first local delivery workspace.","security_isolation_preferences":"No telemetry, local secrets, explicit lifecycle state."},"expected_spec":"# Project Constitution\n\n## Security\nSecrets remain local and credential handling is explicit.\n\n## Quality and Validation\nAcceptance criteria and test evidence are required before promotion.\n\n## Runtime\nThe runtime is loopback-only at 127.0.0.1:3210 and deployment is distinct from verification.","required_markers":["Security","Acceptance","127.0.0.1"]}
          EOF
          dspec-optimize validate --dataset /tmp/dspec-reviewed.jsonl --stage constitution

  package-build:
    needs: [python, frontend, browser, browser-latency, optimizer-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Build frontend static export
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Build candidate package once
        run: python scripts/build-package.py
      - name: Verify candidate package and extracted runtime
        shell: bash
        run: |
          EXPECTED_BUILD="$(git rev-parse HEAD)"
          python scripts/verify-package.py --expected-build "$EXPECTED_BUILD"
      - name: Upload preflight candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: dspec-package-preflight-${{ github.sha }}
          path: |
            dist/dspec-build-v0.1.0.zip
            dist/candidate-manifest.json
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 2

  macos-contract:
    needs: [package-build]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download exact preflight candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: dspec-package-preflight-${{ github.sha }}
          path: dist
      - name: Verify macOS installer and core runtime contract
        shell: bash
        run: |
          EXPECTED_BUILD="$(git rev-parse HEAD)"
          python scripts/verify-macos-install.py --expected-build "$EXPECTED_BUILD"
      - name: Upload macOS contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspec-macos-contract-${{ github.sha }}
          path: evidence/macos-contract.json
          if-no-files-found: ignore
          retention-days: 14

  package-candidate:
    needs: [package-build, macos-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Download macOS-tested candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: dspec-package-preflight-${{ github.sha }}
          path: dist
      - name: Re-verify unchanged candidate bytes
        shell: bash
        run: |
          EXPECTED_BUILD="$(git rev-parse HEAD)"
          python scripts/verify-package.py --expected-build "$EXPECTED_BUILD"
      - name: Upload exact-main candidate artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dspec-candidate-${{ github.sha }}
          path: |
            dist/dspec-build-v0.1.0.zip
            dist/candidate-manifest.json
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 14
